{% extends "blog/base.html" %}
{% load crispy_forms_tags %}
{% block content %}
    <div id="colorlib-main">
        {% if messages %}
                {% for message in messages %}
                    <div class="alert alert-{{ message.tags }}">
                {{ message }}
                    </div>
                {% endfor %}
        {% endif %}
            <div class="container">
                <div class="row d-flex">
                    <div class="col-xl-8 py-5 px-md-5">
                        <div class="row pt-md-4">
                            <div class="col-md-12">
                                

                                    <form method="POST">
                                        {% csrf_token %}
                                        <fieldset class="form-group">
                                            <legend class="border-bottom mb-4">Add Comments</legend>
                                            {{ form|crispy }}
                                        </fieldset>
                                        <div class="form-group">
                                            <button name="comment_id" class="btn btn-outline-info" type="submit">Comment</button>
                                            
                                        </div>

                                    </form>
                                    
                                
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        
    </div>
{% endblock content %}
